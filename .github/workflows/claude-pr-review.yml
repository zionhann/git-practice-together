name: Claude PR 리뷰

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 같은 PR 에 연속으로 푸시하면 이전 리뷰는 취소합니다
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          # main 과 비교해야 하므로 전체 히스토리를 받습니다
          fetch-depth: 0

      - name: Claude 리뷰
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Pro / Max 구독 계정의 OAuth 토큰을 씁니다.
          # 로컬에서 `claude setup-token` 으로 발급한 뒤
          # 저장소 Secrets 에 CLAUDE_CODE_OAUTH_TOKEN 으로 등록하세요.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            브랜치: ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}

            이 저장소는 깃 · 깃허브 특강 팀 프로젝트용 예제입니다.
            리뷰 대상자는 깃을 처음 배우는 수강생입니다.

            ## 먼저 할 일

            저장소 루트의 `CLAUDE.md` 와 `README.md` 를 읽으세요.
            **이 두 문서가 유일한 판단 기준입니다.** 문서에 없는 규칙을 지어내지 마세요.
            문서가 바뀌면 리뷰 기준도 따라 바뀌어야 하므로, 아래 항목은 어디를 볼지 알려주는
            목차일 뿐이고 구체적인 규칙 내용은 항상 문서에서 확인하세요.

            ## 검증 항목

            1. **브랜치 네이밍** — head 브랜치가 `CLAUDE.md` 의 "브랜치 네이밍" 규칙을 따르는지,
               그리고 브랜치의 이슈 번호가 실제로 존재하는 이슈인지
               (`gh issue view <번호>` 로 확인. 없으면 지적)
            2. **PR 규칙** — base 가 `main` 인지,
               `.github/PULL_REQUEST_TEMPLATE.md` 항목이 채워졌는지,
               본문의 `Closes #` 뒤에 이슈 번호가 있고 브랜치의 번호와 같은지
            3. **커밋 컨벤션** — `git log --format='%s' origin/${{ github.event.pull_request.base.ref }}..HEAD`
               로 이 PR 의 커밋만 확인. `CLAUDE.md` 의 커밋 컨벤션 표와 규칙에 맞는지
               (타입·스코프는 영어, 설명은 한국어 명령형, 마침표 없음, 한 커밋에 한 가지 일).
               병합 커밋(`Merge branch ...`)은 충돌 해결 과정이므로 예외입니다
            4. **변경 범위** — `gh pr diff --name-only` 로 확인.
               `index.html` 외의 파일이 바뀌었으면 지적하고, 특히 `style.css` 변경은 반드시 지적
            5. **카드 블록** — `gh pr diff` 로 추가된 카드가
               `index.html` 의 `▼▼▼ 카드 하나 시작` ~ `▲▲▲ 카드 하나 끝` 블록 구조를 지켰는지.
               영상 ID 두 군데(링크 `watch?v=`, 썸네일 `img.youtube.com/vi/.../hqdefault.jpg`)가
               **서로 같은 11 글자 ID** 인지 반드시 대조하세요. 여기가 가장 흔한 실수입니다.
               제목·채널·소개·추천인이 템플릿 예시 값 그대로 남아있지 않은지도 확인
            6. **다른 사람 카드** — diff 에서 기존 카드가 삭제되거나 자리가 옮겨졌는지
               (`-` 로 지워진 줄이 있는지). 새 카드 추가만 있어야 정상입니다
            7. **충돌 흔적** — `<<<<<<<`, `=======`, `>>>>>>>` 마커가 남아있는지

            ## 리뷰 작성 방법

            - 한국어로, 수강생에게 말하듯 친절하게 씁니다
            - 지적할 때는 **왜 문제인지 + 어떻게 고치는지 명령어까지** 적습니다
            - 문제가 없으면 짧게 통과라고만 씁니다. 칭찬을 길게 늘어놓지 마세요
            - `index.html` 안의 구체적인 줄에 대한 지적은 인라인 코멘트로 남깁니다
            - 마지막에 `gh pr comment` 로 아래 형식의 요약을 한 번만 남깁니다:

              ```
              ## 🤖 Claude 리뷰

              | 항목 | 결과 |
              | --- | --- |
              | 브랜치 이름 | ✅ / ⚠️ |
              | PR 본문 · Closes # | ✅ / ⚠️ |
              | 커밋 메시지 | ✅ / ⚠️ |
              | 변경 파일 범위 | ✅ / ⚠️ |
              | 카드 블록 · 영상 ID | ✅ / ⚠️ |
              | 기존 카드 보존 | ✅ / ⚠️ |

              (⚠️ 항목별 설명)
              ```

            이 리뷰는 참고용입니다. 머지 여부는 사람 리뷰어가 정하므로,
            문제를 찾았더라도 실패로 종료하지 말고 코멘트만 남기고 정상 종료하세요.

          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*)"
