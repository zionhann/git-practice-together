<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 클립 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>유튜브 클립 모음</h1>
    <p class="hero-desc">카드를 누르면 유튜브에서 바로 열립니다.</p>
  </header>

  <main class="container">
    <ul class="card-grid">

      <!-- ▼▼▼▼▼ 카드 하나 시작 — 이 블록을 복사해서 쓰세요 ▼▼▼▼▼ -->
      <!-- iwwb-HDfF9I 가 영상 ID 입니다. 아래 두 군데를 내 영상 ID 로 바꾸세요 -->
      <li class="card">
        <a class="card-link"
           href="https://www.youtube.com/watch?v=iwwb-HDfF9I"
           target="_blank" rel="noopener">
          <span class="card-thumb">
            <img src="https://img.youtube.com/vi/iwwb-HDfF9I/hqdefault.jpg"
                 alt="한요한 - Oasis (오아시스) 썸네일"
                 loading="lazy">
          </span>
          <span class="card-body">
            <strong class="card-title">Oasis (오아시스)</strong>
            <span class="card-channel">한요한</span>
            <span class="card-summary">
              한 번 들으면 후렴이 계속 맴도는, 여름에 특히 잘 어울리는 한요한의 Oasis
            </span>
            <span class="card-meta">추천 · 한시온</span>
          </span>
        </a>
      </li>
      <!-- ▲▲▲▲▲ 카드 하나 끝 ▲▲▲▲▲ -->

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 클립이 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 클립이 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
