<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 클립 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>유튜브 클립 모음</h1>
    <p class="hero-desc">카드를 누르면 유튜브에서 바로 열립니다.</p>
  </header>

  <main class="container">
    <ul class="card-grid">

      <li class="card">
        <a class="card-link"
           href="https://www.youtube.com/watch?v=SQ0CFvPeRw0"
           target="_blank" rel="noopener">
          <span class="card-thumb">
            <img src="https://img.youtube.com/vi/SQ0CFvPeRw0/hqdefault.jpg"
                 alt="몬치치 쿠키 썸네일"
                 loading="lazy">
          </span>
          <span class="card-body">
            <strong class="card-title">몬치치 쿠키</strong>
            <span class="card-channel">녹초</span>
            <span class="card-summary">
              귀엽고 맛있으니까 선물해주면 좋을듯합니당
            </span>
            <span class="card-meta">추천 · yejjini</span>
          </span>
        </a>
      </li>

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 클립이 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
