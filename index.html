<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 클립 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>유튜브 클립 모음</h1>
    <p class="hero-desc">카드를 누르면 유튜브에서 바로 열립니다.</p>
  </header>

  <main class="container">
    <ul class="card-grid">

      <!-- ▼▼▼▼▼ 카드 하나 시작 — 이 블록을 복사해서 쓰세요 ▼▼▼▼▼ -->
      <!-- dQw4w9WgXcQ 가 영상 ID 입니다. 아래 두 군데를 내 영상 ID 로 바꾸세요 -->
      <li class="card">
        <a class="card-link"
           href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
           target="_blank" rel="noopener">
          <span class="card-thumb">
            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg"
                 alt="Rick Astley - Never Gonna Give You Up 썸네일"
                 loading="lazy">
          </span>
          <span class="card-body">
            <strong class="card-title">Never Gonna Give You Up</strong>
            <span class="card-channel">Rick Astley · 3:33</span>
            <span class="card-summary">
              링크를 잘못 눌렀을 때 만나게 되는, 인터넷에서 가장 유명한 3분 33초
            </span>
            <span class="card-meta">추천 · 윤가희</span>
          </span>
        </a>
      </li>
      <!-- ▲▲▲▲▲ 카드 하나 끝 ▲▲▲▲▲ -->

      <li class="card">
        <a class="card-link"
           href="https://www.youtube.com/watch?v=yuIB3jmC_0M"
           target="_blank" rel="noopener">
          <span class="card-thumb">
            <img src="https://img.youtube.com/vi/yuIB3jmC_0M/hqdefault.jpg"
                 alt="STORM II 썸네일"
                 loading="lazy">
          </span>
          <span class="card-body">
            <strong class="card-title">STORM II</strong>
            <span class="card-summary">
              뮤비
            </span>
            <span class="card-meta">추천 · 이성민</span>
          </span>
        </a>
      </li>

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 클립이 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
